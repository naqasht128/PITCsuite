name: Build Windows EXE & Inno Setup Installer

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2.8.92) - leave blank to only build artifacts'
        required: false
        default: ''

jobs:
  build-windows:
    name: Build Windows (.exe & Setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Executable with PyInstaller
        run: pyinstaller pitcsuite.spec --clean

      - name: Compile Inno Setup Installer
        run: |
          $ver = "${{ github.ref_type == 'tag' && github.ref_name || '2.8.91' }}".TrimStart("v")
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccCmd) {
              $isccPath = $isccCmd.Source
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          } else {
              choco install innosetup --no-progress -y
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          }
          & $isccPath "/DAppVersion=$ver" installer.iss

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PITCSuite-Windows-Setup
          path: dist/PITCSuite_Setup.exe

      - name: Upload Standalone .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PITCSuite-Standalone-exe
          path: dist/pitcsuite.exe

  release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
    permissions:
      contents: write
    steps:
      - name: Download Setup Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: PITCSuite-Windows-Setup
          path: release-assets/

      - name: Download Standalone .exe Artifact
        uses: actions/download-artifact@v4
        with:
          name: PITCSuite-Standalone-exe
          path: release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/PITCSuite_Setup.exe
            release-assets/pitcsuite.exe
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name }}
          name: PITC Suite Release ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
