name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger this workflow when a tag starting with 'v' is pushed (e.g. v2.3)

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' # Change this if you need a specific python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller requests packaging

    - name: Build with PyInstaller
      run: |
        pyinstaller pitcsuite.spec

    - name: Compile Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer.iss

    - name: Get tag name
      id: get_tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Create GitHub Release and Upload Asset
      uses: softprops/action-gh-release@v1
      with:
        files: dist/PITCSuite_Setup.exe
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
