pipelines:
  # 'custom' pipelines NEVER trigger automatically on push.
  # You run them manually from Bitbucket web UI whenever you want.
  custom:
    build-windows-installer:
      - step:
          name: Build Windows Executable and Installer
          runs-on:
            - self.hosted
            - windows
          script:
            - python -m pip install --upgrade pip
            - pip install -r requirements.txt
            - pip install pyinstaller
            - pyinstaller pitcsuite.spec --noconfirm
            - if (Get-Command ISCC.exe -ErrorAction SilentlyContinue) { ISCC.exe installer.iss } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss } else { Write-Host "Inno Setup not found, only pyinstaller was built." }
          artifacts:
            - dist/**
